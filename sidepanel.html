<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Notion Lens</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <!-- External CSS -->
  <link rel="stylesheet" href="sidepanel.css">
</head>

<body>
  <div class="sidepanel">

    <div class="topbar">
      <div class="brand">

        <svg class="brand-mark" viewBox="0 0 24 24" fill="none">
          <circle
            cx="12"
            cy="12"
            r="9"
            stroke="#1B1A18"
            stroke-width="1.4"
          />
          <circle
            cx="12"
            cy="12"
            r="3.4"
            fill="#B9852A"
          />
        </svg>

        <span class="brand-name">Notion Lens</span>

      </div>

      <div class="sync-cluster">

        <div class="sync-time">
          <span class="label">Synced</span>
          <span class="value" id="syncValue">
            Aug 16 · 14:32
          </span>
        </div>

        <button
          class="refresh-btn"
          id="refreshBtn"
          aria-label="Refresh knowledge base from Notion"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12a9 9 0 1 1-3.2-6.9" />
            <path d="M21 4v5h-5" />
          </svg>
        </button>

      </div>
    </div>

    <div class="notion-connect">
      <div class="connect-status">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">Notion not connected</span>
      </div>
      <button class="connect-btn" id="connectBtn">Connect Notion</button>
    </div>

    <div class="main" id="mainEmptyState">

      <svg class="lens-mark" viewBox="0 0 64 64" fill="none">

        <circle
          cx="32"
          cy="32"
          r="22"
          stroke="#E3E0D8"
          stroke-width="1.5"
        />

        <circle
          cx="32"
          cy="32"
          r="22"
          stroke="#B9852A"
          stroke-width="1.5"
          stroke-dasharray="6 9"
          stroke-linecap="round"
        />

        <circle
          cx="32"
          cy="32"
          r="7"
          fill="#F1E4C6"
          stroke="#B9852A"
          stroke-width="1.2"
        />

      </svg>

      <h1>Ask anything from your workspace</h1>

      <p>
        42 pages
        <span class="dot">·</span>
        3 databases
        <span class="dot">·</span>
        indexed
      </p>

    </div>

    <div class="thread" id="thread" hidden></div>

    <div class="inputbar">

      <div class="field">
        <input
          type="text"
          id="queryInput"
          placeholder="Connect Notion to start asking…"
          autocomplete="off"
          disabled
        />
      </div>

      <button
        class="send-btn"
        id="sendBtn"
        aria-label="Submit question"
        disabled
      >
        <svg viewBox="0 0 24 24">
          <path
            d="M4 12L20 4L13 20L11 13L4 12Z"
            stroke-linejoin="round"
          />
        </svg>
      </button>

    </div>

  </div> 

  <!-- External JavaScript -->
  <script src="sidepanel.js"></script>

</body>
</html>
