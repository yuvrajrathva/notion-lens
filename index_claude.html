<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notion Lens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:   #F6F5F1;
    --panel:   #FFFFFF;
    --ink:     #1B1A18;
    --ink-soft:#726C63;
    --ink-faint:#B4AFA5;
    --line:    #E3E0D8;
    --focus:   #B9852A;
    --focus-dim:#8F6A22;
    --focus-soft:#F1E4C6;
  }

  *{ box-sizing:border-box; }

  html,body{
    height:100%;
    margin:0;
    background:#EAE7E0;
    font-family:'Inter', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ambient backdrop so the popup reads in context */
  body{
    background:
      radial-gradient(circle at 20% 15%, rgba(185,133,42,0.08), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(185,133,42,0.06), transparent 40%),
      #EAE7E0;
  }

  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }

  .stage-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:#9C978C;
  }

  /* ---------- extension popup shell ---------- */
  .popup{
    width:380px;
    height:560px;
    background:var(--paper);
    border-radius:14px;
    overflow:hidden;
    box-shadow:
      0 1px 1px rgba(27,26,24,0.04),
      0 12px 32px rgba(27,26,24,0.16),
      0 2px 6px rgba(27,26,24,0.08);
    display:flex;
    flex-direction:column;
    border:1px solid rgba(27,26,24,0.06);
  }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px 14px;
    border-bottom:1px solid var(--line);
    background:var(--panel);
    flex-shrink:0;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:9px;
  }

  .brand-mark{
    width:20px;
    height:20px;
    flex-shrink:0;
  }

  .brand-name{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:19px;
    color:var(--ink);
    letter-spacing:-0.01em;
  }

  .sync-cluster{
    display:flex;
    align-items:center;
    gap:9px;
  }

  .sync-time{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    line-height:1.25;
  }

  .sync-time .label{
    font-family:'IBM Plex Mono', monospace;
    font-size:9px;
    letter-spacing:0.07em;
    text-transform:uppercase;
    color:var(--ink-faint);
  }

  .sync-time .value{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--ink-soft);
  }

  .refresh-btn{
    width:30px;
    height:30px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--panel);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:border-color 0.15s ease, background 0.15s ease;
    padding:0;
  }

  .refresh-btn:hover{
    border-color:var(--focus);
    background:var(--focus-soft);
  }

  .refresh-btn:focus-visible{
    outline:2px solid var(--focus);
    outline-offset:2px;
  }

  .refresh-btn svg{
    width:15px;
    height:15px;
    stroke:var(--ink-soft);
    transition:stroke 0.15s ease;
  }

  .refresh-btn:hover svg{ stroke:var(--focus-dim); }

  .refresh-btn.spinning svg{
    animation:spin 0.7s cubic-bezier(0.65,0,0.35,1);
  }

  @keyframes spin{
    to{ transform:rotate(180deg); }
  }

  /* ---------- main / empty state ---------- */
  .main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:28px 32px;
    gap:16px;
    text-align:center;
  }

  .lens-mark{
    width:64px;
    height:64px;
    opacity:0.9;
  }

  .main h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:18px;
    color:var(--ink);
    margin:0;
    line-height:1.35;
    max-width:230px;
  }

  .main p{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--ink-faint);
    margin:0;
    letter-spacing:0.01em;
  }

  .main p .dot{
    color:var(--focus);
    margin:0 6px;
  }

  /* ---------- input bar ---------- */
  .inputbar{
    display:flex;
    align-items:flex-end;
    gap:10px;
    padding:14px 16px 16px;
    background:var(--panel);
    border-top:1px solid var(--line);
    flex-shrink:0;
  }

  .field{
    flex:1;
    display:flex;
    align-items:center;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:20px;
    padding:0 6px 0 14px;
    min-height:42px;
    transition:border-color 0.15s ease;
  }

  .field:focus-within{
    border-color:var(--focus);
  }

  .field input{
    flex:1;
    border:none;
    background:transparent;
    outline:none;
    font-family:'Inter', sans-serif;
    font-size:13.5px;
    color:var(--ink);
    padding:10px 4px;
  }

  .field input::placeholder{
    color:var(--ink-faint);
  }

  .send-btn{
    width:36px;
    height:36px;
    min-width:36px;
    border-radius:50%;
    border:none;
    background:var(--ink-faint);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:not-allowed;
    transition:background 0.15s ease, transform 0.1s ease;
    padding:0;
  }

  .send-btn.active{
    background:var(--focus);
    cursor:pointer;
  }

  .send-btn.active:hover{
    background:var(--focus-dim);
  }

  .send-btn.active:active{
    transform:scale(0.94);
  }

  .send-btn svg{
    width:15px;
    height:15px;
    fill:none;
    stroke:#fff;
    stroke-width:2;
    transform:translate(-1px,1px);
  }

  .send-btn:focus-visible{
    outline:2px solid var(--focus);
    outline-offset:2px;
  }

  @media (prefers-reduced-motion: reduce){
    .refresh-btn.spinning svg{ animation:none; }
    .send-btn.active:active{ transform:none; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="popup">

    <div class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="#1B1A18" stroke-width="1.4"/>
          <circle cx="12" cy="12" r="3.4" fill="#B9852A"/>
        </svg>
        <span class="brand-name">Notion Lens</span>
      </div>

      <div class="sync-cluster">
        <div class="sync-time">
          <span class="label">Synced</span>
          <span class="value" id="syncValue">Aug 16 · 14:32</span>
        </div>
        <button class="refresh-btn" id="refreshBtn" aria-label="Refresh knowledge base from Notion">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-3.2-6.9"/>
            <path d="M21 4v5h-5"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="main">
      <svg class="lens-mark" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="22" stroke="#E3E0D8" stroke-width="1.5"/>
        <circle cx="32" cy="32" r="22" stroke="#B9852A" stroke-width="1.5" stroke-dasharray="6 9" stroke-linecap="round"/>
        <circle cx="32" cy="32" r="7" fill="#F1E4C6" stroke="#B9852A" stroke-width="1.2"/>
      </svg>
      <h1>Ask anything from your workspace</h1>
      <p>42 pages<span class="dot">·</span>3 databases<span class="dot">·</span>indexed</p>
    </div>

    <div class="inputbar">
      <div class="field">
        <input type="text" id="queryInput" placeholder="Ask your notes…" autocomplete="off" />
      </div>
      <button class="send-btn" id="sendBtn" aria-label="Submit question" disabled>
        <svg viewBox="0 0 24 24">
          <path d="M4 12L20 4L13 20L11 13L4 12Z" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

  </div>

  <span class="stage-label">Chrome extension popup — 380 × 560</span>
</div>

<script>
  // Refresh button: hardcoded demo behavior — spins and stamps "just now"
  const refreshBtn = document.getElementById('refreshBtn');
  const syncValue = document.getElementById('syncValue');

  refreshBtn.addEventListener('click', () => {
    refreshBtn.classList.remove('spinning');
    void refreshBtn.offsetWidth; // restart animation
    refreshBtn.classList.add('spinning');
    refreshBtn.disabled = true;

    setTimeout(() => {
      syncValue.textContent = 'Just now';
      refreshBtn.disabled = false;
    }, 700);
  });

  // Input + send button wiring
  const queryInput = document.getElementById('queryInput');
  const sendBtn = document.getElementById('sendBtn');

  queryInput.addEventListener('input', () => {
    const hasText = queryInput.value.trim().length > 0;
    sendBtn.classList.toggle('active', hasText);
    sendBtn.disabled = !hasText;
  });

  function submitQuery(){
    if (!queryInput.value.trim()) return;
    // Placeholder: wire this up to the Notion Lens query endpoint later
    console.log('Query submitted:', queryInput.value);
    queryInput.value = '';
    sendBtn.classList.remove('active');
    sendBtn.disabled = true;
  }

  sendBtn.addEventListener('click', submitQuery);
  queryInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitQuery();
  });
</script>

</body>
</html>
